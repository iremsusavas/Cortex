version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./cortex.db:/app/cortex.db

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on: [backend]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
